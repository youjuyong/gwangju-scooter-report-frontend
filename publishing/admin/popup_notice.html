<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>광주 방치킥보드 관리 시스템</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="stylesheet" type="text/css" href="css/base_style.css"/>
    <link rel="stylesheet" type="text/css" href="css/style.css"/>
    <link rel="stylesheet" type="text/css" href="css/m_style.css"/>
    <script src="js/jquery.min.js"></script>
    <script src="js/common.js"></script>
    
  </head>
    
<body>
    
            <div class="popupWrap">
                <div class="popupInner">
                    <div class="popup popup_notice">
                        <h3>공지사항</h3>
                        <button class="popupClose">닫기</button>
                        <div class="popupconten">
                           
                            <table>
                                <tr>
                                    <th>제목</th>
                                    <td class="notititle"> 
                                        <input type="text" placeholder="제목을 입력하세요" ><!--상세보기일 때 value=에 내용 넣고 disabled 넣을 것(모든 입력폼에 적용할 것 textarea 포함입니다.)-->
                                    </td>
                                </tr>
                                <tr>
                                    <th>표출범위</th>
                                    <td>
                                        <label><input type="checkbox"> 사용자</label>
                                        <label><input type="checkbox"> PM사</label>
                                        <label><input type="checkbox"> 견인업체</label>
                                    </td>
                                </tr>
                                <tr>
                                    <th>상단고정</th>
                                    <td><label><input type="checkbox"> 고정</label></td>
                                </tr>
                                <tr>
                                    <th>첨부파일</th>
                                    <td>
                                        <input type="file" >
                                        
                                    </td>
                                </tr>
                                <tr>
                                    <th>표출여부</th>
                                    <td>
                                        <select>
                                            <option>표출함</option>
                                            <option>표출안함</option>
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <th>표출시작일</th>
                                    <td><input type="date"></td>
                                </tr>
                                <tr>
                                    <th>표출종료일</th>
                                    <td><input type="date"></td>
                                </tr>
                                <tr>
                                    <td class="noticon" colspan="2">
                                        <textarea placeholder="내용을 입력하세요"></textarea>
                                    </td>
                                </tr>
                            </table>
                            
                            <!--버튼-->
                            <div class="btnSet">
                                <button>취소</button> <!-- 상세보기일 때 : 수정, 삭제 버튼으로 변경 (빨간색 버튼 없음)-->
                                <button class="red">저장</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>       
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>방치 킥보드 회수 시스템</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="stylesheet" type="text/css" href="css/base_style.css"/>
    <link rel="stylesheet" type="text/css" href="css/style.css"/>
    <script src="js/jquery.min.js"></script>
    <script src="js/common.js"></script>
    
  </head>

    <body>
        
        <!--팝업창-->
        <div class="popupbox" style="display: none;">
            <div class="popupconten camerapop">
                <p class="popuptxt">사진 등록</p>
                <div class="popupbtnset">
                    <button class="btnal">앨범</button>
                    <button class="btnca">촬영</button>
                </div> 
            </div>
            <div class="popbg"></div>
        </div>
        
        <div class="wrap noMenubody noMenubodyLine">
            <header>
                <h1>킥보드 회수 등록</h1>
                <button type="button" class="back" onclick="history.back()">뒤로 가기</button>
            </header>
            <main class="sub_article">  
                <div class="detailBox">
                    <p class="situation si1">처리중</p> <!-- .si1:처리중 , si2: 처리완료-->
                    <p class="add">경기도 광주시 탄벌동</p> <!--도로명 주소만 나옴-->
                    <dl>
                        <dt>신고일시</dt>
                        <dd>2026-01-07 10:11</dd>
                    </dl>
                    <dl>
                        <dt>킥보드ID</dt>
                        <dd>123456</dd>
                    </dl>
                    <dl>
                        <dt>위반유형</dt>
                        <dd>보도와 차도가 구분된 도로</dd>
                    </dl>
                    <dl>
                        <dt>상세설명</dt>
                        <dd>설명이 블라블라 나옵니다. </dd>
                    </dl>
                    <dl>
                        <dt class="result_photo_title">등록한 사진</dt>
                        <dd class="result_meimg">
                            <div class="imgli">
                                <div class="imgsize">                     
                                    <img src="./" alt="주정차 위반 신고 촬영한 사진1">   
                                </div>
                            </div>
                            <div class="imgli lastimgli">
                                <div class="imgsize">                     
                                    <img src="./" alt="주정차 위반 신고 촬영한 사진2">   
                                </div>
                            </div>
                        </dd>
                    </dl>
                    
                </div>
                
                
                <div class="detailBox_re">
                    
                    <div class="re_con">
                        <dl>
                            <dt>처리자</dt>
                            <dd>처리자 ID</dd>
                        </dl>
                        <div>
                            <span class="listtitle" id="photo-label">사진등록</span>
                                    <div class="pic-list" role="group" aria-labelledby="photo-label" aria-describedby="photo-help">
                                        <ul>
                                            <li>
                                                <div class="imgsize">
                                                    <!--사진 들어가면 나올 삭제 버튼
                                                    <button class="pic-del">삭제</button>-->

                                                    <!--사진은 아래처럼 img 로 나올 것
                                                    <img src="./" alt="주정차 위반 신고 촬영한 사진1">-->
                                                  
                                                    <input type="file" id="photo1" class="visually-hidden">
                                                    <label for="photo1" class="camerain">첫 번째 사진</label>
                                                </div>
                                            </li>
                                            <li>
                                                <div class="imgsize">
                                                    <!--사진 들어가면 나올 삭제 버튼
                                                    <button class="pic-del">삭제</button>-->

                                                    <!--사진은 아래처럼 img 로 나올 것
                                                    <img src="./" alt="주정차 위반 신고 촬영한 사진2">-->
                                                  
                                                    <input type="file" id="photo2" class="visually-hidden">
                                                    <label for="photo2" class="camerain">두 번째 사진</label>
                                                </div>
                                            </li>
                                        </ul>
                                    </div>
                            
                        </div>
                        <div class="reasonBox">
                            <label for="reason">사유</label>
                            <input type="text" id="reason" name="reason" placeholder="사유를 입력하세요" required>
                        </div>
                    </div>
                    
                    <div class="listbtnset">
                        <button class="btn_complete">완료처리</button>
                        <button class="btn_acc">회수진행</button>
                        <!--<button type="button" class="btn_ok">처리완료</button>-->
                   </div>
                </div>
            </main>
        </div> 
    </body>
</html>

<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>방치 킥보드 회수 시스템</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="stylesheet" type="text/css" href="css/base_style.css"/>
    <link rel="stylesheet" type="text/css" href="css/style.css"/>
    <script src="js/jquery.min.js"></script>
    <script src="js/common.js"></script>
    
  </head>

    <body>
        <div class="wrap noMenubody noMenubodyLine">
            <header>
                <h1>공지사항</h1>
                <button type="button" class="back" onclick="history.back()">뒤로 가기</button>
            </header>
            <main class="sub_article">  
                <div class="allBox">
                    
                    <table class="notiTable">
                          <caption>공지사항 상세</caption>

                          <colgroup>
                                <col style="width: 0%;">
                                <col style="width: 100%;">
                          </colgroup>

                          <tbody>
                            <tr>
                                <th scope="row">제목</th>
                                <td class="title">제목이 나옵니다.</td>
                            </tr>
                            <tr>
                                <th scope="row">작성일</th>
                                <td class="notiday"><time datetime="2026-05-05">2026-05-05</time></td>
                            </tr>
                              <tr>
                                <th scope="row">첨부파일</th>
                                  <td class="borderBottom"><a href="/files/report.pdf" download aria-label="파일이름이 나옵니다">파일이름이 나옵니다.</a></td>
                            </tr>
                            <tr>
                                <th scope="row">내용</th>
                                <td class="content">내용이 나옵니다.</td>
                            </tr>
                          </tbody>
                    </table>
                    
                </div>
            </main>
        </div> 
    </body>
</html>

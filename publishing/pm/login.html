<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>방치 킥보드 회수 시스템</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="stylesheet" type="text/css" href="css/base_style.css"/>
    <link rel="stylesheet" type="text/css" href="css/style.css"/>
    <script src="js/jquery.min.js"></script>
    <script src="js/common.js"></script>
    
  </head>

    <body>

        <div class="wrap loginWrap"> <!--여기 wrap 부분에 페이지별 3가지 종류의 클래스가 있습니다. 염두하고 개발해주세요-->
            <header>
                <h1><img src="./images/simbol_s.png"> 방치 킥보드 회수 시스템</h1>
            </header>
            <div class="loginback">
                <div class="login_img">
                    <img src="./images/main_all_img.png" alt="광주시 방치킥보드 회수 시스템" class="mainImg">
                </div>
                <div class="loginBox">
                    <h2>LOGIN</h2>
                    <div class="logoin_conten">
                        <input class="id" type="text" autocomplete="username" placeholder="ID(휴대폰번호)"/>
                        <input class="pw" type="password" placeholder="비밀번호"/>
                        <label>
                            <input type="checkbox"> ID저장
                        </label>
                        <button class="btn_login">로그인</button>
                    </div>
                </div>
            </div>

        </div>
    </body>
</html>

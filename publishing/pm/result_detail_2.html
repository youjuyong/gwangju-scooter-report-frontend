<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>방치 킥보드 회수 시스템</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="stylesheet" type="text/css" href="css/base_style.css"/>
    <link rel="stylesheet" type="text/css" href="css/style.css"/>
    <script src="js/jquery.min.js"></script>
    <script src="js/common.js"></script>
    
  </head>

    <body>
        <div class="wrap noMenubody noMenubodyLine">
            <header>
                <h1>킥보드 회수 상세정보</h1>
                <button type="button" class="back" onclick="history.back()">뒤로 가기</button>
            </header>
            <main class="sub_article">  
                <div class="detailBox">
                    <p class="situation si2">처리완료</p> <!-- .si1:처리중 , si2: 처리완료-->
                    <p class="add">경기도 광주시 탄벌동</p> <!--도로명 주소만 나옴-->
                    <dl>
                        <dt>신고일시</dt>
                        <dd>2026-01-07 10:11</dd>
                    </dl>
                    <dl>
                        <dt>킥보드ID</dt>
                        <dd>123456</dd>
                    </dl>
                    <dl>
                        <dt>위반유형</dt>
                        <dd>보도와 차도가 구분된 도로</dd>
                    </dl>
                    <dl>
                        <dt>상세설명</dt>
                        <dd>설명이 블라블라 나옵니다. </dd>
                    </dl>
                    <dl>
                        <dt class="result_photo_title">등록한 사진</dt>
                        <dd class="result_meimg">
                            <div class="imgli">
                                <div class="imgsize">                     
                                    <img src="./" alt="주정차 위반 신고 촬영한 사진1">   
                                </div>
                            </div>
                            <div class="imgli lastimgli">
                                <div class="imgsize">                     
                                    <img src="./" alt="주정차 위반 신고 촬영한 사진2">   
                                </div>
                            </div>
                        </dd>
                    </dl>
                    
                </div>
                
                
                <div class="detailBox_re">
                    
                    <div class="re_con">
                        <dl>
                            <dt>처리자</dt>
                            <dd>처리자 ID</dd>
                        </dl>
                        <dl>
                            <dt>처리일시</dt>
                            <dd>2026-09-05</dd>
                        </dl>
                        
                        <dl>
                            <dt class="result_photo_title">업체에서 등록한 사진</dt>
                            <dd class="result_meimg">
                                <div class="imgli">
                                    <div class="imgsize">                     
                                        <img src="./" alt="처리 사진1">   
                                    </div>
                                </div>
                                <div class="imgli lastimgli">
                                    <div class="imgsize">      
                                        <!--두번째 처리사진 있으면 나오고 없으면 img 태그는 없어지게 해주세요
                                        <img src="./" alt="처리 사진2">   -->
                                    </div>
                                </div>
                            </dd>
                        </dl>

                    </div>

                    
                    <button type="button" class="btn_ok">확인</button> 
                </div>
            </main>
        </div> 
    </body>
</html>
